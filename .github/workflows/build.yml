name: build-and-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: extension-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Read extension metadata
        run: |
          echo "EXT_ID=$(grep '^extId=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "EXT_NAME=$(grep '^extName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 repository secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/signing-key.jks"
          chmod +x ./gradlew

      - name: Build signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          VERSION="v${GITHUB_SHA::7}"
          APP_PATH="app/build/${EXT_ID}-${VERSION}.eapk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing-key.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=key0 \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

          cp app/build/outputs/apk/release/app-release.apk "$APP_PATH"

      - name: Verify signed artifact
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APP_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXT_ID }}-${{ env.VERSION }}
          path: ${{ env.APP_PATH }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.EXT_NAME }} ${{ env.VERSION }}
          body: |
            Automated build of ${{ env.EXT_NAME }} (`${{ env.EXT_ID }}`).
            Commit: ${{ github.sha }}
          files: ${{ env.APP_PATH }}
          make_latest: true
